<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jolibi - Gà Rán Ngon Đỉnh</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: #fff9f0;
            color: #2d1e0f;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #b22222, #d43d3d);
            color: white;
            padding: 1rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo i {
            font-size: 2.5rem;
            color: #ffd966;
            filter: drop-shadow(2px 2px 0 #7a1f1f);
        }

        .logo span {
            text-shadow: 3px 3px 0 #7a1f1f;
        }

        .cart-icon {
            background: #ffd966;
            color: #7a1f1f;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #fff3c9;
            box-shadow: 0 4px 0 #7a1f1f;
        }

        .cart-icon:hover {
            background: #ffeaa0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #7a1f1f;
        }

        .cart-icon i {
            font-size: 1.3rem;
        }

        .cart-count {
            background: #7a1f1f;
            color: #ffd966;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 900;
        }

        /* Hero banner */
        .hero {
            background: linear-gradient(120deg, #ffe9c7, #ffd9a3);
            padding: 2.5rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
            border-bottom: 5px dashed #b22222;
        }

        .hero-text h1 {
            font-size: 2.8rem;
            color: #7a1f1f;
            margin-bottom: 12px;
            text-shadow: 2px 2px 0 #ffd966;
        }

        .hero-text p {
            font-size: 1.2rem;
            color: #4b2e1a;
            margin-bottom: 20px;
            max-width: 500px;
        }

        .hero-text .promo {
            background: #b22222;
            color: #ffd966;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 5px 0 #6b1414;
        }

        .hero-img {
            font-size: 8rem;
            filter: drop-shadow(8px 8px 0 rgba(0, 0, 0, 0.1));
            transform: rotate(5deg);
        }

        /* Menu grid */
        .menu-section {
            padding: 3rem 5%;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: #7a1f1f;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .section-title::after {
            content: "🍗🍗🍗";
            display: block;
            font-size: 1.5rem;
            letter-spacing: 10px;
            margin-top: 8px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
            margin-bottom: 3rem;
        }

        .product-card {
            background: white;
            border-radius: 30px 30px 20px 20px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08), 0 4px 0 #b22222;
            padding: 20px 16px 20px;
            transition: 0.25s ease;
            border: 2px solid #f0d5b0;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(180, 40, 40, 0.2), 0 6px 0 #b22222;
        }

        .product-icon {
            font-size: 4.5rem;
            text-align: center;
            margin: 10px 0 5px;
            filter: drop-shadow(2px 6px 4px rgba(0, 0, 0, 0.15));
        }

        .product-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4b2e1a;
            text-align: center;
            margin: 8px 0 4px;
        }

        .product-desc {
            color: #7a5a3a;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .product-price {
            font-size: 1.6rem;
            font-weight: 800;
            color: #b22222;
            text-align: center;
            margin: 6px 0 16px;
        }

        .product-price small {
            font-size: 1rem;
            font-weight: 400;
            color: #7a5a3a;
        }

        .btn-add {
            background: #ffd966;
            border: none;
            color: #7a1f1f;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 14px 0;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #b8860b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            border: 2px solid #ffeaa0;
        }

        .btn-add:hover {
            background: #ffeaa0;
            box-shadow: 0 7px 0 #b8860b;
            transform: scale(1.02);
        }

        .btn-add:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b8860b;
        }

        /* Cart Modal */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .cart-modal.active {
            display: flex;
        }

        .cart-content {
            background: #fff9f0;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            border-radius: 40px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4);
            border: 4px solid #b22222;
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px dashed #b22222;
            padding-bottom: 16px;
            margin-bottom: 16px;
            font-size: 1.7rem;
            font-weight: 800;
            color: #7a1f1f;
        }

        .cart-header i {
            cursor: pointer;
            font-size: 2rem;
            transition: 0.2s;
        }

        .cart-header i:hover {
            color: #b22222;
            transform: scale(1.1);
        }

        .cart-items {
            overflow-y: auto;
            max-height: 350px;
            padding-right: 6px;
            margin-bottom: 16px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #faeedc;
            padding: 12px 16px;
            border-radius: 30px;
            margin-bottom: 12px;
            border: 2px solid #e0c7a8;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .cart-item-icon {
            font-size: 2rem;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #4b2e1a;
        }

        .cart-item-price {
            font-weight: 600;
            color: #b22222;
            font-size: 1rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .cart-item-controls button {
            background: white;
            border: 2px solid #b22222;
            color: #b22222;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }

        .cart-item-controls button:hover {
            background: #b22222;
            color: white;
        }

        .cart-item-controls span {
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }

        .cart-item-total {
            font-weight: 800;
            color: #7a1f1f;
            font-size: 1.2rem;
            white-space: nowrap;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.6rem;
            font-weight: 900;
            padding: 16px 8px;
            border-top: 3px dashed #b22222;
            color: #7a1f1f;
        }

        .btn-checkout {
            background: #b22222;
            color: #ffd966;
            font-size: 1.4rem;
            font-weight: 800;
            border: none;
            padding: 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b1414;
            transition: 0.15s;
            letter-spacing: 1px;
            margin-top: 8px;
            border: 2px solid #ffd966;
        }

        .btn-checkout:hover {
            background: #d43d3d;
            box-shadow: 0 10px 0 #6b1414;
        }

        .btn-checkout:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #6b1414;
        }

        .empty-cart {
            text-align: center;
            padding: 30px;
            color: #9b7b5b;
            font-size: 1.3rem;
            font-style: italic;
        }

        /* Footer */
        footer {
            background: #2d1e0f;
            color: #ffd966;
            text-align: center;
            padding: 2rem 5%;
            margin-top: 3rem;
            border-top: 8px solid #b22222;
        }

        footer p {
            opacity: 0.9;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .hero-text h1 { font-size: 2rem; }
            .hero-img { font-size: 5rem; }
            .logo { font-size: 1.5rem; }
            .logo i { font-size: 2rem; }
            .cart-icon { padding: 8px 14px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fas fa-drumstick-bite"></i>
            <span>JOLIBI</span>
        </div>
        <div class="cart-icon" id="cartIcon">
            <i class="fas fa-shopping-cart"></i>
            <span>Giỏ hàng</span>
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-text">
            <h1>Gà rán Jolibi<br>giòn rụm mê ly!</h1>
            <p>Thưởng thức ngay gà rán nóng hổi, giòn tan với công thức gia truyền.</p>
            <div class="promo">🎉 Mua 2 tặng 1 🎉</div>
        </div>
        <div class="hero-img">
            🍗🔥
        </div>
    </section>

    <!-- Menu -->
    <section class="menu-section">
        <h2 class="section-title">Thực đơn hôm nay</h2>
        <div class="product-grid" id="productGrid">
            <!-- Sản phẩm sẽ được render bằng JS -->
        </div>
    </section>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <span>🍗 Giỏ hàng</span>
                <i class="fas fa-times-circle" id="closeCart"></i>
            </div>
            <div class="cart-items" id="cartItemsContainer">
                <!-- Cart items sẽ render ở đây -->
            </div>
            <div class="cart-total">
                <span>Tổng cộng:</span>
                <span id="cartTotalPrice">0đ</span>
            </div>
            <button class="btn-checkout" id="checkoutBtn">
                <i class="fas fa-check-circle"></i> Đặt hàng ngay
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2025 Jolibi Gà Rán - Ngon không thể cưỡng lại! 🍗</p>
        <p style="font-size: 0.9rem; margin-top: 8px;">Hotline: 1900 1234 | Địa chỉ: 123 Đường Gà, TP.HCM</p>
    </footer>

    <script>
        // Danh sách sản phẩm
        const products = [
            { id: 1, name: 'Gà Rán Giòn', desc: '1 miếng gà rán giòn rụm', price: 45000, icon: '🍗' },
            { id: 2, name: 'Combo 2 Gà', desc: '2 miếng gà + khoai tây chiên', price: 89000, icon: '🍗🍟' },
            { id: 3, name: 'Gà Sốt Cay', desc: 'Gà rán phủ sốt cay Hàn Quốc', price: 55000, icon: '🌶️🍗' },
            { id: 4, name: 'Burger Gà', desc: 'Burger kẹp gà giòn + sốt mayo', price: 49000, icon: '🍔' },
            { id: 5, name: 'Khoai Tây Chiên', desc: 'Khoai tây chiên giòn (L)', price: 25000, icon: '🍟' },
            { id: 6, name: 'Combo Gia Đình', desc: '4 gà + 2 khoai + 3 nước', price: 199000, icon: '🍗🍟🥤' },
            { id: 7, name: 'Gà Quay Mật Ong', desc: 'Gà quay mật ong thơm lừng', price: 65000, icon: '🍯🍗' },
            { id: 8, name: 'Pepsi Lon', desc: 'Nước ngọt mát lạnh', price: 15000, icon: '🥤' }
        ];

        // Giỏ hàng: mảng các object { id, name, price, icon, quantity }
        let cart = [];

        // DOM elements
        const productGrid = document.getElementById('productGrid');
        const cartModal = document.getElementById('cartModal');
        const cartIcon = document.getElementById('cartIcon');
        const closeCart = document.getElementById('closeCart');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartTotalPrice = document.getElementById('cartTotalPrice');
        const cartCountSpan = document.getElementById('cartCount');
        const checkoutBtn = document.getElementById('checkoutBtn');

        // Render sản phẩm ra grid
        function renderProducts() {
            productGrid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-icon">${p.icon}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-desc">${p.desc}</div>
                    <div class="product-price">${p.price.toLocaleString('vi-VN')}đ</div>
                    <button class="btn-add" data-id="${p.id}">
                        <i class="fas fa-cart-plus"></i> Thêm vào giỏ
                    </button>
                </div>
            `).join('');

            // Gắn sự kiện cho từng nút "Thêm vào giỏ"
            document.querySelectorAll('.btn-add').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = Number(e.currentTarget.getAttribute('data-id'));
                    addToCart(id);
                });
            });
        }

        // Thêm sản phẩm vào giỏ
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    icon: product.icon,
                    quantity: 1
                });
            }

            updateCartUI();
            // Hiệu ứng nhẹ cho biết đã thêm
            cartIcon.style.transform = 'scale(1.1)';
            setTimeout(() => cartIcon.style.transform = '', 150);
        }

        // Cập nhật giao diện giỏ hàng (số lượng trên icon, render modal, tổng tiền)
        function updateCartUI() {
            // Cập nhật số lượng hiển thị trên icon
            const totalQuantity = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountSpan.textContent = totalQuantity;

            // Render danh sách items trong modal
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<div class="empty-cart">🍽️ Giỏ hàng trống, mời bạn chọn món!</div>`;
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item" data-id="${item.id}">
                        <div class="cart-item-info">
                            <span class="cart-item-icon">${item.icon}</span>
                            <div>
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-price">${item.price.toLocaleString('vi-VN')}đ</div>
                                <div class="cart-item-controls">
                                    <button class="decrease-qty" data-id="${item.id}">−</button>
                                    <span>${item.quantity}</span>
                                    <button class="increase-qty" data-id="${item.id}">+</button>
                                </div>
                            </div>
                        </div>
                        <div class="cart-item-total">
                            ${(item.price * item.quantity).toLocaleString('vi-VN')}đ
                        </div>
                    </div>
                `).join('');

                // Gắn sự kiện tăng/giảm số lượng
                document.querySelectorAll('.decrease-qty').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = Number(e.currentTarget.getAttribute('data-id'));
                        updateQuantity(id, -1);
                    });
                });

                document.querySelectorAll('.increase-qty').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = Number(e.currentTarget.getAttribute('data-id'));
                        updateQuantity(id, 1);
                    });
                });
            }

            // Tính tổng tiền
            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            cartTotalPrice.textContent = total.toLocaleString('vi-VN') + 'đ';
        }

        // Tăng/giảm số lượng sản phẩm trong giỏ
        function updateQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (!item) return;

            const newQuantity = item.quantity + delta;

            if (newQuantity <= 0) {
                // Xóa sản phẩm khỏi giỏ
                cart = cart.filter(item => item.id !== productId);
            } else {
                item.quantity = newQuantity;
            }

            updateCartUI();
        }

        // Mở/đóng modal giỏ hàng
        function openCartModal() {
            cartModal.classList.add('active');
            updateCartUI(); // đảm bảo dữ liệu mới nhất
        }

        function closeCartModal() {
            cartModal.classList.remove('active');
        }

        // Xử lý đặt hàng
        function handleCheckout() {
            if (cart.length === 0) {
                alert('Giỏ hàng của bạn đang trống. Hãy chọn món trước nhé!');
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const orderSummary = cart.map(item => 
                `${item.name} x${item.quantity} = ${(item.price * item.quantity).toLocaleString('vi-VN')}đ`
            ).join('\n');

            alert(`✅ Đặt hàng thành công!\n\n${orderSummary}\n\nTổng cộng: ${total.toLocaleString('vi-VN')}đ\n\nCảm ơn bạn đã ủng hộ Jolibi! 🍗`);

            // Xóa giỏ hàng sau khi đặt
            cart = [];
            updateCartUI();
            closeCartModal();
        }

        // Khởi tạo các sự kiện
        function init() {
            renderProducts();
            updateCartUI();

            // Mở modal khi click icon giỏ hàng
            cartIcon.addEventListener('click', openCartModal);

            // Đóng modal
            closeCart.addEventListener('click', closeCartModal);

            // Click ra ngoài modal cũng đóng
            cartModal.addEventListener('click', (e) => {
                if (e.target === cartModal) {
                    closeCartModal();
                }
            });

            // Nút đặt hàng
            checkoutBtn.addEventListener('click', handleCheckout);
        }

        // Chạy khi DOM load xong
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
